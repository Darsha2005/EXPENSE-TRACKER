<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ExpenseIQ – Smart Expense Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0a0a0f;
    --surface: #13131a;
    --surface2: #1c1c28;
    --border: #2a2a3d;
    --accent: #7c6ef7;
    --accent2: #e05f8e;
    --gpay: #1a73e8;
    --gpay-glow: rgba(26,115,232,0.25);
    --green: #2dd4a0;
    --red: #f0647a;
    --yellow: #f5c842;
    --text: #e8e8f0;
    --muted: #6b6b85;
    --card-glow: rgba(124,110,247,0.12);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'DM Mono', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* Ambient background */
  body::before {
    content: '';
    position: fixed;
    top: -200px; left: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(124,110,247,0.08) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }
  body::after {
    content: '';
    position: fixed;
    bottom: -200px; right: -200px;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(224,95,142,0.07) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  .app {
    max-width: 1100px;
    margin: 0 auto;
    padding: 32px 20px;
    position: relative;
    z-index: 1;
  }

  /* ── HEADER ── */
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 40px;
    flex-wrap: wrap;
    gap: 16px;
  }
  .logo {
    font-family: 'Syne', sans-serif;
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
  }
  .logo span { color: var(--accent); }
  .logo small {
    display: block;
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    font-weight: 300;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .gpay-btn {
    display: flex;
    align-items: center;
    gap: 10px;
    background: var(--gpay);
    color: #fff;
    padding: 12px 22px;
    border-radius: 50px;
    border: none;
    cursor: pointer;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    letter-spacing: 0.3px;
    text-decoration: none;
    transition: all 0.25s;
    box-shadow: 0 0 24px var(--gpay-glow);
    position: relative;
    overflow: hidden;
  }
  .gpay-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: rgba(255,255,255,0.1);
    opacity: 0;
    transition: opacity 0.2s;
  }
  .gpay-btn:hover::before { opacity: 1; }
  .gpay-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 32px var(--gpay-glow); }
  .gpay-icon {
    width: 22px; height: 22px;
    display: flex; align-items: center; justify-content: center;
  }

  /* ── SUMMARY CARDS ── */
  .summary {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 16px;
    margin-bottom: 32px;
  }
  @media(max-width:640px){ .summary { grid-template-columns: 1fr; } }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 24px;
    position: relative;
    overflow: hidden;
    transition: transform 0.2s;
  }
  .card:hover { transform: translateY(-3px); }
  .card::after {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: var(--card-accent, var(--accent));
    border-radius: 18px 18px 0 0;
  }
  .card.green { --card-accent: var(--green); }
  .card.red   { --card-accent: var(--red); }
  .card.purple{ --card-accent: var(--accent); }

  .card-label {
    font-size: 10px;
    text-transform: uppercase;
    letter-spacing: 2px;
    color: var(--muted);
    margin-bottom: 10px;
  }
  .card-amount {
    font-family: 'Syne', sans-serif;
    font-size: 32px;
    font-weight: 800;
    line-height: 1;
  }
  .card-amount.green { color: var(--green); }
  .card-amount.red   { color: var(--red); }
  .card-amount.purple{ color: var(--accent); }
  .card-sub { font-size: 11px; color: var(--muted); margin-top: 6px; }

  /* ── TWO-COLUMN LAYOUT ── */
  .main-grid {
    display: grid;
    grid-template-columns: 380px 1fr;
    gap: 24px;
    align-items: start;
  }
  @media(max-width:800px){ .main-grid { grid-template-columns: 1fr; } }

  /* ── ADD EXPENSE FORM ── */
  .panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 28px;
  }
  .panel-title {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    margin-bottom: 22px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .panel-title .dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 10px var(--accent);
  }

  .form-group { margin-bottom: 16px; }
  label {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 7px;
  }
  input, select, textarea {
    width: 100%;
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 14px;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    font-size: 13px;
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    appearance: none;
  }
  input:focus, select:focus, textarea:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(124,110,247,0.15);
  }
  select option { background: var(--surface2); color: var(--text); }

  .category-grid {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 20px;
  }
  .cat-btn {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 4px;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    font-size: 10px;
    color: var(--muted);
    transition: all 0.2s;
    font-family: 'DM Mono', monospace;
  }
  .cat-btn .emoji { font-size: 20px; }
  .cat-btn:hover, .cat-btn.active {
    border-color: var(--accent);
    background: rgba(124,110,247,0.12);
    color: var(--text);
  }

  .submit-btn {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    border: none;
    border-radius: 12px;
    padding: 14px;
    font-family: 'Syne', sans-serif;
    font-weight: 700;
    font-size: 14px;
    cursor: pointer;
    letter-spacing: 0.5px;
    transition: all 0.25s;
    box-shadow: 0 4px 20px rgba(124,110,247,0.3);
  }
  .submit-btn:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(124,110,247,0.4); }
  .submit-btn:active { transform: translateY(0); }

  /* ── EXPENSE LIST ── */
  .list-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 16px;
  }
  .filter-tabs {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }
  .tab {
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid var(--border);
    background: transparent;
    color: var(--muted);
    font-family: 'DM Mono', monospace;
    font-size: 11px;
    cursor: pointer;
    transition: all 0.2s;
  }
  .tab.active, .tab:hover {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  .expense-list { display: flex; flex-direction: column; gap: 10px; }

  .expense-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 14px;
    transition: all 0.2s;
    animation: slideIn 0.3s ease;
  }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(-8px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .expense-item:hover { border-color: var(--border); background: var(--surface2); }

  .emoji-badge {
    width: 44px; height: 44px;
    border-radius: 12px;
    background: var(--surface2);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 20px;
    flex-shrink: 0;
    border: 1px solid var(--border);
  }

  .item-info { flex: 1; min-width: 0; }
  .item-name {
    font-family: 'Syne', sans-serif;
    font-weight: 600;
    font-size: 14px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item-meta {
    font-size: 11px;
    color: var(--muted);
    margin-top: 3px;
    display: flex;
    gap: 10px;
  }
  .item-tag {
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 1px 6px;
  }
  .gpay-tag {
    background: rgba(26,115,232,0.15);
    border-color: rgba(26,115,232,0.3);
    color: #6aabff;
  }

  .item-amount {
    font-family: 'Syne', sans-serif;
    font-size: 16px;
    font-weight: 700;
    color: var(--red);
    white-space: nowrap;
  }

  .del-btn {
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    font-size: 16px;
    padding: 4px;
    transition: color 0.2s;
    line-height: 1;
  }
  .del-btn:hover { color: var(--red); }

  .empty-state {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
  }
  .empty-state .big { font-size: 48px; margin-bottom: 12px; }
  .empty-state p { font-size: 12px; }

  /* ── CHART ── */
  .chart-wrap {
    margin-top: 24px;
  }
  .bar-row {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 10px;
    font-size: 11px;
  }
  .bar-label { width: 70px; color: var(--muted); text-align: right; flex-shrink: 0; }
  .bar-track {
    flex: 1;
    height: 8px;
    background: var(--surface2);
    border-radius: 4px;
    overflow: hidden;
  }
  .bar-fill {
    height: 100%;
    border-radius: 4px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width 0.6s cubic-bezier(0.34,1.56,0.64,1);
  }
  .bar-val { width: 60px; flex-shrink: 0; color: var(--text); font-weight: 500; }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 30px; left: 50%;
    transform: translateX(-50%) translateY(100px);
    background: var(--surface2);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 24px;
    font-size: 13px;
    z-index: 1000;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1);
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.4);
  }
  .toast.show { transform: translateX(-50%) translateY(0); }

  /* Scrollbar */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: var(--bg); }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app">

  <!-- HEADER -->
  <header>
    <div class="logo">
      Expense<span>IQ</span>
      <small>Smart Expense Tracker</small>
    </div>
    <a class="gpay-btn" id="gpayBtn" href="#" onclick="openGPay(event)">
      <div class="gpay-icon">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" width="22" height="22">
          <path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/>
          <path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/>
          <path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"/>
          <path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/>
        </svg>
      </div>
      Open Google Pay
    </a>
  </header>

  <!-- SUMMARY CARDS -->
  <div class="summary">
    <div class="card green">
      <div class="card-label">💰 Total Budget</div>
      <div class="card-amount green" id="budgetDisplay">₹0</div>
      <div class="card-sub">
        <input type="number" id="budgetInput" placeholder="Set monthly budget..." style="margin-top:8px;font-size:12px;padding:7px 10px;" oninput="updateBudget()">
      </div>
    </div>
    <div class="card red">
      <div class="card-label">📤 Total Spent</div>
      <div class="card-amount red" id="totalSpent">₹0</div>
      <div class="card-sub" id="spentSub">0 transactions</div>
    </div>
    <div class="card purple">
      <div class="card-label">🏦 Remaining</div>
      <div class="card-amount purple" id="remaining">₹0</div>
      <div class="card-sub" id="remainingPct">–</div>
    </div>
  </div>

  <!-- MAIN GRID -->
  <div class="main-grid">

    <!-- LEFT: ADD FORM -->
    <div>
      <div class="panel">
        <div class="panel-title"><span class="dot"></span> Add Expense</div>

        <div class="form-group">
          <label>Description</label>
          <input type="text" id="expName" placeholder="e.g. Swiggy order, Rent...">
        </div>

        <div class="form-group">
          <label>Amount (₹)</label>
          <input type="number" id="expAmount" placeholder="0.00" min="0">
        </div>

        <div class="form-group">
          <label>Date</label>
          <input type="date" id="expDate">
        </div>

        <div class="form-group">
          <label>Category</label>
          <div class="category-grid" id="catGrid">
            <button class="cat-btn active" data-cat="Food" onclick="setCategory(this)"><span class="emoji">🍔</span>Food</button>
            <button class="cat-btn" data-cat="Transport" onclick="setCategory(this)"><span class="emoji">🚗</span>Travel</button>
            <button class="cat-btn" data-cat="Shopping" onclick="setCategory(this)"><span class="emoji">🛍️</span>Shop</button>
            <button class="cat-btn" data-cat="Bills" onclick="setCategory(this)"><span class="emoji">💡</span>Bills</button>
            <button class="cat-btn" data-cat="Health" onclick="setCategory(this)"><span class="emoji">💊</span>Health</button>
            <button class="cat-btn" data-cat="Entertainment" onclick="setCategory(this)"><span class="emoji">🎬</span>Fun</button>
            <button class="cat-btn" data-cat="Groceries" onclick="setCategory(this)"><span class="emoji">🛒</span>Grocery</button>
            <button class="cat-btn" data-cat="Other" onclick="setCategory(this)"><span class="emoji">📦</span>Other</button>
          </div>
        </div>

        <div class="form-group">
          <label>Payment Method</label>
          <select id="expMethod">
            <option value="Google Pay">Google Pay 📱</option>
            <option value="Cash">Cash 💵</option>
            <option value="Credit Card">Credit Card 💳</option>
            <option value="Debit Card">Debit Card 🏧</option>
            <option value="Net Banking">Net Banking 🌐</option>
            <option value="UPI">UPI</option>
          </select>
        </div>

        <div class="form-group">
          <label>Note (optional)</label>
          <input type="text" id="expNote" placeholder="Any extra detail...">
        </div>

        <button class="submit-btn" onclick="addExpense()">+ Add Expense</button>
      </div>

      <!-- CHART -->
      <div class="panel chart-wrap" style="margin-top:16px;">
        <div class="panel-title"><span class="dot" style="background:var(--accent2);box-shadow:0 0 10px var(--accent2)"></span> By Category</div>
        <div id="chartBars"><div style="color:var(--muted);font-size:12px;">No data yet.</div></div>
      </div>
    </div>

    <!-- RIGHT: EXPENSE LIST -->
    <div class="panel">
      <div class="list-header">
        <div class="panel-title" style="margin-bottom:0"><span class="dot" style="background:var(--green);box-shadow:0 0 10px var(--green)"></span> Transactions</div>
        <div class="filter-tabs">
          <button class="tab active" onclick="filterExpenses('All', this)">All</button>
          <button class="tab" onclick="filterExpenses('Google Pay', this)">GPay</button>
          <button class="tab" onclick="filterExpenses('Food', this)">Food</button>
          <button class="tab" onclick="filterExpenses('Bills', this)">Bills</button>
        </div>
      </div>
      <div style="height:14px"></div>
      <div class="expense-list" id="expenseList">
        <div class="empty-state">
          <div class="big">💸</div>
          <p>No expenses yet.<br>Add your first one!</p>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- TOAST -->
<div class="toast" id="toast">✅ Expense added!</div>

<script>
  const EMOJI = {
    Food:'🍔', Transport:'🚗', Shopping:'🛍️', Bills:'💡',
    Health:'💊', Entertainment:'🎬', Groceries:'🛒', Other:'📦'
  };

  let expenses = JSON.parse(localStorage.getItem('expenses') || '[]');
  let budget = parseFloat(localStorage.getItem('budget') || '0');
  let selectedCat = 'Food';
  let filterMode = 'All';

  // Set today as default date
  document.getElementById('expDate').valueAsDate = new Date();
  if (budget) document.getElementById('budgetInput').value = budget;

  function setCategory(el) {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    el.classList.add('active');
    selectedCat = el.dataset.cat;
  }

  function updateBudget() {
    budget = parseFloat(document.getElementById('budgetInput').value) || 0;
    localStorage.setItem('budget', budget);
    render();
  }

  function addExpense() {
    const name   = document.getElementById('expName').value.trim();
    const amount = parseFloat(document.getElementById('expAmount').value);
    const date   = document.getElementById('expDate').value;
    const method = document.getElementById('expMethod').value;
    const note   = document.getElementById('expNote').value.trim();

    if (!name) return shake('expName');
    if (!amount || amount <= 0) return shake('expAmount');
    if (!date) return shake('expDate');

    expenses.unshift({ id: Date.now(), name, amount, date, cat: selectedCat, method, note });
    localStorage.setItem('expenses', JSON.stringify(expenses));

    document.getElementById('expName').value = '';
    document.getElementById('expAmount').value = '';
    document.getElementById('expNote').value = '';
    document.getElementById('expDate').valueAsDate = new Date();

    showToast(`✅ ${name} — ₹${amount.toLocaleString('en-IN')} added!`);
    render();
  }

  function deleteExpense(id) {
    expenses = expenses.filter(e => e.id !== id);
    localStorage.setItem('expenses', JSON.stringify(expenses));
    render();
  }

  function filterExpenses(mode, el) {
    filterMode = mode;
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    el.classList.add('active');
    render();
  }

  function openGPay(e) {
    e.preventDefault();
    // Try deep link first (works on Android/iOS with GPay installed)
    const deepLink = 'tez://upi/';
    const webFallback = 'https://pay.google.com';
    const start = Date.now();
    const iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = deepLink;
    document.body.appendChild(iframe);
    setTimeout(() => {
      document.body.removeChild(iframe);
      if (Date.now() - start < 1600) window.open(webFallback, '_blank');
    }, 1500);
    showToast('📱 Opening Google Pay…');
  }

  function render() {
    const total = expenses.reduce((s, e) => s + e.amount, 0);
    const rem = budget - total;

    document.getElementById('totalSpent').textContent = '₹' + total.toLocaleString('en-IN');
    document.getElementById('spentSub').textContent = expenses.length + ' transaction' + (expenses.length !== 1 ? 's' : '');
    document.getElementById('budgetDisplay').textContent = '₹' + budget.toLocaleString('en-IN');
    document.getElementById('remaining').textContent = (rem < 0 ? '-₹' : '₹') + Math.abs(rem).toLocaleString('en-IN');
    document.getElementById('remainingPct').textContent = budget > 0
      ? Math.round((rem / budget) * 100) + '% remaining'
      : 'Set a budget above';

    // Filter
    let shown = expenses;
    if (filterMode === 'Google Pay') shown = expenses.filter(e => e.method === 'Google Pay');
    else if (filterMode !== 'All') shown = expenses.filter(e => e.cat === filterMode);

    // List
    const list = document.getElementById('expenseList');
    if (shown.length === 0) {
      list.innerHTML = `<div class="empty-state"><div class="big">💸</div><p>No expenses here yet!</p></div>`;
    } else {
      list.innerHTML = shown.map(e => `
        <div class="expense-item">
          <div class="emoji-badge">${EMOJI[e.cat] || '📦'}</div>
          <div class="item-info">
            <div class="item-name">${esc(e.name)}</div>
            <div class="item-meta">
              <span class="item-tag">${e.cat}</span>
              <span class="item-tag ${e.method === 'Google Pay' ? 'gpay-tag' : ''}">${e.method}</span>
              <span>${formatDate(e.date)}</span>
              ${e.note ? `<span style="color:var(--muted)">— ${esc(e.note)}</span>` : ''}
            </div>
          </div>
          <div class="item-amount">₹${e.amount.toLocaleString('en-IN')}</div>
          <button class="del-btn" onclick="deleteExpense(${e.id})" title="Delete">✕</button>
        </div>
      `).join('');
    }

    // Chart
    const cats = {};
    expenses.forEach(e => cats[e.cat] = (cats[e.cat] || 0) + e.amount);
    const maxVal = Math.max(...Object.values(cats), 1);
    const chartEl = document.getElementById('chartBars');
    if (Object.keys(cats).length === 0) {
      chartEl.innerHTML = `<div style="color:var(--muted);font-size:12px;">No data yet.</div>`;
    } else {
      chartEl.innerHTML = Object.entries(cats)
        .sort((a,b) => b[1]-a[1])
        .map(([cat, val]) => `
          <div class="bar-row">
            <div class="bar-label">${EMOJI[cat] || '📦'} ${cat}</div>
            <div class="bar-track"><div class="bar-fill" style="width:${(val/maxVal*100).toFixed(1)}%"></div></div>
            <div class="bar-val">₹${val.toLocaleString('en-IN')}</div>
          </div>
        `).join('');
    }
  }

  function shake(id) {
    const el = document.getElementById(id);
    el.style.borderColor = 'var(--red)';
    el.style.boxShadow = '0 0 0 3px rgba(240,100,122,0.2)';
    setTimeout(() => { el.style.borderColor = ''; el.style.boxShadow = ''; }, 1200);
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
  }

  function formatDate(d) {
    if (!d) return '';
    const [y,m,day] = d.split('-');
    const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
    return `${day} ${months[parseInt(m)-1]} ${y}`;
  }

  function esc(s) {
    return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  render();
</script>
</body>
</html>
